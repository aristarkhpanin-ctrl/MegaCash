include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Сгенерированные схемы Isar. Правится не файл, а модель в entities.dart.
    - "**/*.g.dart"
    # Взятый в репозиторий сторонний плагин: чинили его сборку, а не стиль.
    - "packages/**"
  errors:
    # Пропущенный await в коде работы с базой — ошибка, а не подсказка.
    unawaited_futures: error

linter:
  rules:
    # Слой domain должен оставаться чистым Dart: относительные импорты
    # внутри lib держат зависимости явными.
    prefer_relative_imports: true
    require_trailing_commas: true
    unawaited_futures: true
