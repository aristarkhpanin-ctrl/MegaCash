<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.mc-dark{--c-bg:#16150F;--c-surface:#201E16;--c-surface-2:#2B2820;--c-border:#3B3729;--c-text:#F2EEE3;--c-text-2:#9A9384;--c-brand:#FFC72E;--c-brand-pressed:#E0A800;--c-on-brand:#1F1A05;--c-brand-sub:#3A2F0C;--c-success:#4ADE80;--c-error:#F87171;}
</style>
</helmet>
<div class="{{ themeClass }}" style="width:360px; height:780px; display:flex; flex-direction:column; background: var(--c-bg,#FFFFFF); color: var(--c-text,#1A1814); border-radius:30px; overflow:hidden; font-family:'Golos Text','Manrope',sans-serif; box-shadow: inset 0 0 0 1px var(--c-border,#E3DDD0);">

  <div style="height:36px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; font-weight:600;">
    <span>9:41</span>
    <span style="display:inline-flex; align-items:center; gap:6px;">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 3.2C10.4 3.2 12.1 3.9 13.4 5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5.2 6.4C6.1 5.6 7.3 5.1 8.5 5.1C9.7 5.1 10.9 5.6 11.8 6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="8.6" r="1.2" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1.6" width="20" height="8.8" rx="2.4" stroke="currentColor" stroke-width="1.4"/><rect x="2.8" y="3.4" width="14" height="5.2" rx="1.2" fill="currentColor"/><rect x="22.4" y="4" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
    </span>
  </div>

  <div style="flex:0 0 auto; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:8px 20px 14px;">
    <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
      <div style="font-size:26px; font-weight:700; line-height:1.1; letter-spacing:-0.01em;">Мои карты</div>
      <div style="font-size:14px; font-weight:400; color: var(--c-text-2,#6B665C);">{{ countText }}</div>
    </div>
    <sc-if value="{{ hasList }}" hint-placeholder-val="{{ true }}">
      <button style="min-height:40px; margin-top:2px; padding:0 14px 0 12px; flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; background: var(--c-brand,#FFC000); color: var(--c-on-brand,#1F1A05); border:none; border-radius:10px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        Карта
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 32px; gap:12px;">
      <div style="width:64px; height:64px; border-radius:16px; background: var(--c-surface,#F7F5F0); display:flex; align-items:center; justify-content:center; margin-bottom:4px; color: var(--c-text-2,#6B665C);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5" width="19" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 9.5h19" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <div style="font-size:18px; font-weight:600;">Пока нет карт</div>
      <div style="font-size:14px; font-weight:400; line-height:1.45; color: var(--c-text-2,#6B665C); max-width:250px; text-wrap:pretty;">Добавьте банковские карты — МегаКэш будет подсказывать, какой платить у кассы.</div>
      <button style="margin-top:8px; min-height:48px; padding:0 22px; border-radius:10px; border:none; background: var(--c-brand,#FFC000); color: var(--c-on-brand,#1F1A05); font-family:inherit; font-size:16px; font-weight:600; cursor:pointer;">Добавить карту</button>
    </div>
  </sc-if>

  <sc-if value="{{ hasList }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1 1 auto; overflow-y:auto; padding:0 20px 18px;">
      <div style="display:flex; flex-direction:column; gap:10px;">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="5">
          <div style="display:flex; align-items:center; gap:12px; min-height:64px; padding:12px 14px; border-radius:12px; background: var(--c-surface,#F7F5F0); border:1px solid var(--c-border,#E3DDD0);">
            <div style="width:40px; height:40px; border-radius:9px; flex:0 0 auto; background: {{ c.bankColor }};"></div>
            <div style="flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px;">
              <div style="font-size:16px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ c.bankName }}</div>
              <div style="font-size:13px; font-weight:400; color: var(--c-text-2,#6B665C); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ c.sub }}</div>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex:0 0 auto; color: var(--c-text-2,#6B665C);"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </sc-for>
      </div>
      <button style="margin-top:12px; width:100%; min-height:48px; border-radius:10px; border:1.5px solid var(--c-border,#E3DDD0); background:transparent; color: var(--c-text,#1A1814); font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        Добавить карту
      </button>
    </div>
  </sc-if>

  <sc-if value="{{ banner }}" hint-placeholder-val="{{ true }}">
    <div style="flex:0 0 auto; height:56px; display:flex; align-items:center; justify-content:center; padding:3px 20px;">
      <div style="width:100%; max-width:320px; height:50px; border-radius:8px; border:1px dashed var(--c-border,#E3DDD0); background: var(--c-surface-2,#EFEBE2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C);">место под рекламу · 320×50</div>
    </div>
  </sc-if>

  <div style="flex:0 0 auto; height:64px; border-top:1px solid var(--c-border,#E3DDD0); display:flex; align-items:stretch; padding:0 24px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color: var(--c-text-2,#6B665C);">
      <div style="width:44px; height:26px; display:flex; align-items:center; justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <span style="font-size:11px; font-weight:500;">Кэшбэк</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color: var(--c-text,#1A1814);">
      <div style="position:relative; width:44px; height:26px; display:flex; align-items:center; justify-content:center;">
        <div style="position:absolute; inset:0; border-radius:999px; background: var(--c-brand-sub,#FFF4D6);"></div>
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" style="position:relative;"><rect x="2.5" y="5" width="19" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 9.5h19" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <span style="font-size:11px; font-weight:600;">Карты</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 360, &quot;height&quot;: 780 },
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;state&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;list&quot;, &quot;empty&quot;, &quot;overflow&quot;], &quot;default&quot;: &quot;list&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;banner&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state || 'list';
    const banner = this.props.banner !== false;
    const C = { sber:'#21A038', alfa:'#EF3124', tb:'#1C1C1E', vtb:'#009FDF', raif:'#FEE600',
      gpb:'#1F2A63', ozon:'#005BFF', ya:'#FC3F1D', pochta:'#7B3FBF', sovkom:'#005CAB' };
    const all = [
      { bankName:'Сбербанк', product:'СберКарта', base:1, cats:3, bankColor:C.sber },
      { bankName:'Альфа-Банк', product:'Alfa Travel', base:1.5, cats:3, bankColor:C.alfa },
      { bankName:'Т-Банк', product:'Black', base:1, cats:4, bankColor:C.tb },
      { bankName:'ВТБ', product:'Мультикарта', base:1, cats:2, bankColor:C.vtb },
      { bankName:'Райффайзен', product:'Кэшбэк', base:1.5, cats:5, bankColor:C.raif },
      { bankName:'Газпромбанк', product:'Умная карта', base:1, cats:3, bankColor:C.gpb },
      { bankName:'Озон Банк', product:'Ozon Card', base:1, cats:2, bankColor:C.ozon },
      { bankName:'Яндекс Пэй', product:'Пэй', base:1, cats:3, bankColor:C.ya },
      { bankName:'Почта Банк', product:'Пятёрочка', base:1, cats:1, bankColor:C.pochta },
      { bankName:'Совкомбанк', product:'Халва', base:1, cats:4, bankColor:C.sovkom }
    ];
    const fmt = n => (Number.isInteger(n) ? n : String(n).replace('.', ',')) + '%';
    const catWord = n => n % 10 === 1 && n % 100 !== 11 ? 'категория' : ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) ? 'категории' : 'категорий';
    const list = state === 'overflow' ? all : all.slice(0, 5);
    const cards = list.map(c => ({ ...c, sub: c.product + ' · базовый ' + fmt(c.base) + ' · ' + c.cats + ' ' + catWord(c.cats) }));
    const n = cards.length;
    const cardWord = n % 10 === 1 && n % 100 !== 11 ? 'карта' : ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) ? 'карты' : 'карт';
    const isEmpty = state === 'empty';
    return {
      themeClass: this.props.theme === 'dark' ? 'mc-dark' : '',
      banner,
      isEmpty,
      hasList: !isEmpty,
      cards: isEmpty ? [] : cards,
      countText: isEmpty ? 'Ни одной карты' : (n + ' ' + cardWord)
    };
  }
}
</script>
</body>
</html>
