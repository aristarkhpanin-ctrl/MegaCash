<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; border-radius:999px; background: {{ bg }}; color: {{ fg }}; border:1.5px solid {{ border }}; opacity: {{ opacity }}; font-size:14px; font-weight:500; white-space:nowrap;">
  <span>{{ label }}</span>
  <sc-if value="{{ showPct }}" hint-placeholder-val="{{ true }}"><span style="font-weight:700;">{{ pctText }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 180, &quot;height&quot;: 60 },
  &quot;label&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Кафе и рестораны&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;percent&quot;: { &quot;editor&quot;: &quot;float&quot;, &quot;default&quot;: 5, &quot;tsType&quot;: &quot;number&quot; },
  &quot;state&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;selected&quot;, &quot;unselected&quot;, &quot;disabled&quot;], &quot;default&quot;: &quot;unselected&quot;, &quot;tsType&quot;: &quot;'selected'|'unselected'|'disabled'&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const st = p.state || 'unselected';
    const hasPct = p.percent != null && p.percent !== '';
    const pctNum = Number(p.percent);
    const pct = Number.isFinite(pctNum) ? pctNum : 0;
    const showPct = hasPct && Number.isFinite(pctNum);
    const pctText = showPct ? ((Number.isInteger(pct) ? pct : pct.toFixed(1)) + '%') : '';
    let bg = 'transparent', fg = 'var(--c-text,#1A1814)', border = 'var(--c-border,#E3DDD0)', opacity = '1';
    if (st === 'selected') { bg = 'var(--c-brand,#FFC000)'; fg = 'var(--c-on-brand,#1F1A05)'; border = 'transparent'; }
    else if (st === 'disabled') { bg = 'var(--c-surface-2,#EFEBE2)'; fg = 'var(--c-text-2,#6B665C)'; border = 'transparent'; opacity = '0.55'; }
    return { label: p.label || 'Категория', pctText, showPct, bg, fg, border, opacity };
  }
}
</script>
</body>
</html>
