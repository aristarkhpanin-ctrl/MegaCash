<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.mc-dark{--c-bg:#16150F;--c-surface:#201E16;--c-surface-2:#2B2820;--c-border:#3B3729;--c-text:#F2EEE3;--c-text-2:#9A9384;--c-brand:#FFC72E;--c-brand-pressed:#E0A800;--c-on-brand:#1F1A05;--c-brand-sub:#3A2F0C;--c-success:#4ADE80;--c-error:#F87171;}
@keyframes mc-pop { 0% { transform: scale(0.6); opacity:0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity:1; } }
</style>
</helmet>
<div class="{{ themeClass }}" style="width:360px; height:780px; display:flex; flex-direction:column; background: var(--c-bg,#FFFFFF); color: var(--c-text,#1A1814); border-radius:30px; overflow:hidden; font-family:'Golos Text','Manrope',sans-serif; box-shadow: inset 0 0 0 1px var(--c-border,#E3DDD0);">

  <div style="height:36px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; font-weight:600;">
    <span>9:41</span>
    <span style="display:inline-flex; align-items:center; gap:6px;">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 3.2C10.4 3.2 12.1 3.9 13.4 5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5.2 6.4C6.1 5.6 7.3 5.1 8.5 5.1C9.7 5.1 10.9 5.6 11.8 6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="8.6" r="1.2" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1.6" width="20" height="8.8" rx="2.4" stroke="currentColor" stroke-width="1.4"/><rect x="2.8" y="3.4" width="14" height="5.2" rx="1.2" fill="currentColor"/><rect x="22.4" y="4" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
    </span>
  </div>

  <div style="flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 32px;">
    <div style="width:96px; height:96px; border-radius:999px; background: var(--c-brand,#FFC000); display:flex; align-items:center; justify-content:center; margin-bottom:24px; animation: mc-pop 0.4s ease-out;">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" style="color: var(--c-on-brand,#1F1A05);"><path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1 style="margin:0 0 8px; font-size:26px; font-weight:700; letter-spacing:-0.01em; text-wrap:pretty;">Кэшбэк на февраль собран</h1>
    <p style="margin:0 0 20px; font-size:15px; line-height:1.5; color: var(--c-text-2,#6B665C); max-width:280px; text-wrap:pretty;">8 категорий по 4 картам. Теперь у кассы просто откройте МегаКэш — он подскажет, чем платить.</p>

    <div style="width:100%; max-width:290px; display:flex; gap:10px;">
      <div style="flex:1; padding:14px 6px; border-radius:12px; background: var(--c-surface,#F7F5F0); border:1px solid var(--c-border,#E3DDD0);">
        <div style="font-size:26px; font-weight:800; line-height:1;">8</div>
        <div style="font-size:12px; color: var(--c-text-2,#6B665C); margin-top:3px;">категорий</div>
      </div>
      <div style="flex:1; padding:14px 6px; border-radius:12px; background: var(--c-surface,#F7F5F0); border:1px solid var(--c-border,#E3DDD0);">
        <div style="font-size:26px; font-weight:800; line-height:1;">4</div>
        <div style="font-size:12px; color: var(--c-text-2,#6B665C); margin-top:3px;">карты</div>
      </div>
      <div style="flex:1; padding:14px 6px; border-radius:12px; background: var(--c-surface,#F7F5F0); border:1px solid var(--c-border,#E3DDD0);">
        <div style="font-size:26px; font-weight:800; line-height:1;">10%</div>
        <div style="font-size:12px; color: var(--c-text-2,#6B665C); margin-top:3px;">максимум</div>
      </div>
    </div>
  </div>

  <div style="flex:0 0 auto; padding:12px 24px 26px; display:flex; flex-direction:column; gap:10px;">
    <button style="width:100%; min-height:52px; border-radius:10px; border:none; background: var(--c-brand,#FFC000); color: var(--c-on-brand,#1F1A05); font-family:inherit; font-size:16px; font-weight:600; cursor:pointer;">На главный экран</button>
    <button style="width:100%; min-height:48px; border-radius:10px; border:none; background:transparent; color: var(--c-text-2,#6B665C); font-family:inherit; font-size:15px; font-weight:600; cursor:pointer;">Посмотреть список активации</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 360, &quot;height&quot;: 780 },
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  renderVals() { return { themeClass: this.props.theme === 'dark' ? 'mc-dark' : '' }; }
}
</script>
</body>
</html>
