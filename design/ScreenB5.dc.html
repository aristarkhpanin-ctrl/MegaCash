<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.mc-dark{--c-bg:#16150F;--c-surface:#201E16;--c-surface-2:#2B2820;--c-border:#3B3729;--c-text:#F2EEE3;--c-text-2:#9A9384;--c-brand:#FFC72E;--c-brand-pressed:#E0A800;--c-on-brand:#1F1A05;--c-brand-sub:#3A2F0C;--c-success:#4ADE80;--c-error:#F87171;}
</style>
</helmet>
<div class="{{ themeClass }}" style="width:360px; height:780px; display:flex; flex-direction:column; background: var(--c-bg,#FFFFFF); color: var(--c-text,#1A1814); border-radius:30px; overflow:hidden; font-family:'Golos Text','Manrope',sans-serif; box-shadow: inset 0 0 0 1px var(--c-border,#E3DDD0);">

  <div style="height:36px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; font-weight:600;">
    <span>9:41</span>
    <span style="display:inline-flex; align-items:center; gap:6px;">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 3.2C10.4 3.2 12.1 3.9 13.4 5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5.2 6.4C6.1 5.6 7.3 5.1 8.5 5.1C9.7 5.1 10.9 5.6 11.8 6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="8.6" r="1.2" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1.6" width="20" height="8.8" rx="2.4" stroke="currentColor" stroke-width="1.4"/><rect x="2.8" y="3.4" width="14" height="5.2" rx="1.2" fill="currentColor"/><rect x="22.4" y="4" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
    </span>
  </div>

  <div style="flex:0 0 auto; display:flex; align-items:center; gap:2px; padding:2px 8px 6px;">
    <button style="width:48px; height:48px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:transparent; border:none; color: var(--c-text,#1A1814); cursor:pointer;" aria-label="Закрыть">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div style="flex:1 1 auto; min-width:0; font-size:18px; font-weight:600;">Категория вручную</div>
  </div>

  <div style="flex:1 1 auto; overflow-y:auto; padding:6px 20px 16px; display:flex; flex-direction:column; gap:20px;">

    <div style="display:flex; flex-direction:column; gap:8px;">
      <label style="font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C);">Категория</label>
      <div style="display:flex; align-items:center; gap:10px; min-height:48px; padding:0 14px; border-radius:10px; border:1.5px solid var(--c-border,#E3DDD0); background: var(--c-surface,#F7F5F0);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="color: var(--c-text-2,#6B665C); flex:0 0 auto;"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span style="flex:1 1 auto; font-size:16px;">рест</span>
      </div>
      <div style="border-radius:10px; border:1px solid var(--c-border,#E3DDD0); overflow:hidden;">
        <sc-for list="{{ results }}" as="r" hint-placeholder-count="4">
          <div style="display:flex; align-items:center; gap:10px; min-height:48px; padding:0 14px; background: {{ r.bg }}; border-bottom:1px solid var(--c-border,#E3DDD0);">
            <span style="flex:1 1 auto; font-size:15px; font-weight: {{ r.weight }};">{{ r.label }}</span>
            <sc-if value="{{ r.checked }}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="color: var(--c-brand-pressed,#E0A800);"><path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <label style="font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C);">Процент кэшбэка</label>
      <div style="display:flex; align-items:center; min-height:48px; padding:0 6px 0 14px; border-radius:10px; border:1.5px solid var(--c-border,#E3DDD0); background: var(--c-surface,#F7F5F0);">
        <span style="flex:1 1 auto; font-size:16px; font-weight:600;">7%</span>
        <div style="display:flex; gap:2px;">
          <button style="width:36px; height:36px; border-radius:8px; border:none; background: var(--c-surface-2,#EFEBE2); color: var(--c-text,#1A1814); font-size:20px; cursor:pointer;">−</button>
          <button style="width:36px; height:36px; border-radius:8px; border:none; background: var(--c-surface-2,#EFEBE2); color: var(--c-text,#1A1814); font-size:18px; cursor:pointer;">+</button>
        </div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <label style="font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C);">На какой карте</label>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:11px; min-height:52px; padding:0 14px; border-radius:10px; border:1.5px solid {{ c.border }}; background: {{ c.bg }};">
            <div style="width:26px; height:26px; border-radius:6px; flex:0 0 auto; background: {{ c.color }};"></div>
            <div style="flex:1 1 auto; min-width:0;">
              <div style="font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ c.bank }}</div>
              <div style="font-size:12px; color: var(--c-text-2,#6B665C);">{{ c.product }}</div>
            </div>
            <div style="width:22px; height:22px; flex:0 0 auto; border-radius:999px; border:2px solid {{ c.dot }}; display:flex; align-items:center; justify-content:center;">
              <sc-if value="{{ c.checked }}" hint-placeholder-val="{{ false }}"><div style="width:11px; height:11px; border-radius:999px; background: var(--c-brand,#FFC000);"></div></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="flex:0 0 auto; padding:12px 20px 24px;">
    <button style="width:100%; min-height:52px; border-radius:10px; border:none; background: var(--c-brand,#FFC000); color: var(--c-on-brand,#1F1A05); font-family:inherit; font-size:16px; font-weight:600; cursor:pointer;">Добавить категорию</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 360, &quot;height&quot;: 780 },
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const results = [
      { label:'Кафе и рестораны', sel:true },
      { label:'Рестораны быстрого питания', sel:false },
      { label:'Доставка ресторанов', sel:false },
      { label:'Рестораны при отелях', sel:false }
    ].map(r => ({
      label: r.label, checked: r.sel,
      weight: r.sel ? '600' : '400',
      bg: r.sel ? 'var(--c-brand-sub,#FFF4D6)' : 'var(--c-surface,#F7F5F0)'
    }));
    const cards = [
      { bank:'Альфа-Банк', product:'Alfa Travel', color:'#EF3124', sel:true },
      { bank:'Сбербанк', product:'СберКарта', color:'#21A038', sel:false },
      { bank:'Т-Банк', product:'Black', color:'#1C1C1E', sel:false }
    ].map(c => ({
      ...c, checked: c.sel,
      border: c.sel ? 'var(--c-brand,#FFC000)' : 'var(--c-border,#E3DDD0)',
      bg: c.sel ? 'var(--c-brand-sub,#FFF4D6)' : 'var(--c-surface,#F7F5F0)',
      dot: c.sel ? 'var(--c-brand,#FFC000)' : 'var(--c-border,#E3DDD0)'
    }));
    return { themeClass: this.props.theme === 'dark' ? 'mc-dark' : '', results, cards };
  }
}
</script>
</body>
</html>
