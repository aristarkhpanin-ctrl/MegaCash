<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; justify-content:space-between; gap:10px; min-height:120px; padding:16px; border-radius:12px; border:1px solid var(--c-border,#E3DDD0); background: {{ bg }}; transform: {{ transform }}; transition: transform 0.08s ease, background 0.08s ease; cursor:pointer;">
  <div style="display:flex; align-items:center; gap:8px; min-width:0;">
    <div style="width:12px; height:12px; border-radius:999px; flex:0 0 auto; background: {{ bankColor }};"></div>
    <div style="font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ bankName }}</div>
  </div>
  <div style="font-size:18px; font-weight:600; line-height:1.2; color: var(--c-text,#1A1814); text-wrap:pretty; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{ category }}</div>
  <div style="font-size:34px; font-weight:800; line-height:0.95; color: var(--c-text,#1A1814);">{{ pctText }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 200, &quot;height&quot;: 130 },
  &quot;category&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Супермаркеты&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;percent&quot;: { &quot;editor&quot;: &quot;float&quot;, &quot;default&quot;: 5, &quot;tsType&quot;: &quot;number&quot; },
  &quot;bankName&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Сбербанк&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;bankColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#21A038&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;pressed&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const pctNum = Number(p.percent);
    const pct = Number.isFinite(pctNum) ? pctNum : 0;
    const pressed = p.pressed === true || p.pressed === 'true';
    return {
      category: p.category || 'Категория',
      bankName: p.bankName || '',
      bankColor: p.bankColor || '#3B3729',
      pctText: (Number.isInteger(pct) ? pct : pct.toFixed(1)) + '%',
      bg: pressed ? 'var(--c-surface-2,#EFEBE2)' : 'var(--c-surface,#F7F5F0)',
      transform: pressed ? 'scale(0.98)' : 'scale(1)'
    };
  }
}
</script>
</body>
</html>
