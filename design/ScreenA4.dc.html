<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.mc-dark{--c-bg:#16150F;--c-surface:#201E16;--c-surface-2:#2B2820;--c-border:#3B3729;--c-text:#F2EEE3;--c-text-2:#9A9384;--c-brand:#FFC72E;--c-brand-pressed:#E0A800;--c-on-brand:#1F1A05;--c-brand-sub:#3A2F0C;--c-success:#4ADE80;--c-error:#F87171;}
</style>
</helmet>
<div class="{{ themeClass }}" style="width:360px; height:780px; display:flex; flex-direction:column; background: var(--c-bg,#FFFFFF); color: var(--c-text,#1A1814); border-radius:30px; overflow:hidden; font-family:'Golos Text','Manrope',sans-serif; box-shadow: inset 0 0 0 1px var(--c-border,#E3DDD0);">

  <div style="height:36px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; font-weight:600;">
    <span>9:41</span>
    <span style="display:inline-flex; align-items:center; gap:6px;">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 3.2C10.4 3.2 12.1 3.9 13.4 5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5.2 6.4C6.1 5.6 7.3 5.1 8.5 5.1C9.7 5.1 10.9 5.6 11.8 6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="8.6" r="1.2" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1.6" width="20" height="8.8" rx="2.4" stroke="currentColor" stroke-width="1.4"/><rect x="2.8" y="3.4" width="14" height="5.2" rx="1.2" fill="currentColor"/><rect x="22.4" y="4" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
    </span>
  </div>

  <div style="flex:0 0 auto; display:flex; align-items:center; gap:2px; padding:2px 8px 6px;">
    <button style="width:48px; height:48px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:transparent; border:none; color: var(--c-text,#1A1814); cursor:pointer;" aria-label="Назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div style="flex:1 1 auto; min-width:0; font-size:18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Карта банка</div>
    <button style="min-height:44px; padding:0 12px; flex:0 0 auto; background:transparent; border:none; color: var(--c-error,#C5221F); font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;">Удалить</button>
  </div>

  <div style="flex:1 1 auto; overflow-y:auto; padding:8px 20px 24px; display:flex; flex-direction:column; gap:20px;">

    <div style="display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; background: var(--c-surface,#F7F5F0); border:1px solid var(--c-border,#E3DDD0);">
      <div style="width:40px; height:40px; border-radius:9px; flex:0 0 auto; background:#21A038;"></div>
      <div style="flex:1 1 auto; min-width:0;">
        <div style="font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C);">Банк</div>
        <div style="font-size:16px; font-weight:600;">Сбербанк</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C);">Название продукта</label>
      <div style="min-height:48px; padding:0 14px; border-radius:10px; border:1.5px solid var(--c-border,#E3DDD0); background: var(--c-surface,#F7F5F0); display:flex; align-items:center; font-size:16px;">СберКарта</div>
    </div>

    <div style="display:flex; gap:12px;">
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C);">Базовый процент</label>
        <div style="min-height:48px; padding:0 14px; border-radius:10px; border:1.5px solid var(--c-border,#E3DDD0); background: var(--c-surface,#F7F5F0); display:flex; align-items:center; font-size:16px;">1%</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C);">Лимит категорий</label>
        <div style="min-height:48px; padding:0 6px 0 14px; border-radius:10px; border:1.5px solid var(--c-border,#E3DDD0); background: var(--c-surface,#F7F5F0); display:flex; align-items:center; justify-content:space-between; font-size:16px;">
          <span>{{ limit }}</span>
          <div style="display:flex; gap:2px;">
            <button style="width:34px; height:34px; border-radius:8px; border:none; background: var(--c-surface-2,#EFEBE2); color: var(--c-text,#1A1814); font-size:20px; line-height:1; cursor:pointer;">−</button>
            <button style="width:34px; height:34px; border-radius:8px; border:none; background: var(--c-surface-2,#EFEBE2); color: var(--c-text,#1A1814); font-size:18px; line-height:1; cursor:pointer;">+</button>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">
        <div style="font-size:18px; font-weight:600;">Категории кэшбэка</div>
        <div style="font-size:13px; font-weight:500; color: {{ limitColor }};">Выбрано {{ selectedCount }} из {{ limit }}</div>
      </div>
      <div style="font-size:13px; line-height:1.4; color: var(--c-text-2,#6B665C);">{{ helper }}</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <sc-for list="{{ chips }}" as="ch" hint-placeholder-count="10">
          <dc-import name="Chip" label="{{ ch.label }}" percent="{{ ch.percent }}" state="{{ ch.state }}" hint-size="140px,40px"></dc-import>
        </sc-for>
      </div>
    </div>

    <button style="margin-top:4px; width:100%; min-height:48px; border-radius:10px; border:1.5px solid var(--c-error,#C5221F); background:transparent; color: var(--c-error,#C5221F); font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M7 7l1 12.5A1.5 1.5 0 0 0 9.5 21h5a1.5 1.5 0 0 0 1.5-1.5L17 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Удалить карту
    </button>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 360, &quot;height&quot;: 780 },
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const limit = 3;
    const cats = [
      { label:'Супермаркеты', percent:5, sel:true },
      { label:'Кафе и рестораны', percent:7, sel:true },
      { label:'Такси', percent:10, sel:true },
      { label:'АЗС и заправки', percent:5, sel:false },
      { label:'Аптеки', percent:5, sel:false },
      { label:'Транспорт', percent:3, sel:false },
      { label:'Развлечения', percent:5, sel:false },
      { label:'Онлайн-подписки', percent:7, sel:false },
      { label:'Красота и уход', percent:5, sel:false },
      { label:'Одежда и обувь', percent:3, sel:false },
      { label:'Путешествия', percent:5, sel:false },
      { label:'Спорт и фитнес', percent:5, sel:false }
    ];
    const selectedCount = cats.filter(c => c.sel).length;
    const full = selectedCount >= limit;
    const chips = cats.map(c => ({
      label: c.label,
      percent: c.percent,
      state: c.sel ? 'selected' : (full ? 'disabled' : 'unselected')
    }));
    return {
      themeClass: this.props.theme === 'dark' ? 'mc-dark' : '',
      limit,
      selectedCount,
      limitColor: full ? 'var(--c-text-2,#6B665C)' : 'var(--c-text,#1A1814)',
      helper: full
        ? 'Лимит выбран. Чтобы включить другую категорию, снимите одну из выбранных.'
        : 'Отметьте категории с повышенным кэшбэком. Можно выбрать до ' + limit + '.',
      chips
    };
  }
}
</script>
</body>
</html>
