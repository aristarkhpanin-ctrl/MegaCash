<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.mc-dark{--c-bg:#16150F;--c-surface:#201E16;--c-surface-2:#2B2820;--c-border:#3B3729;--c-text:#F2EEE3;--c-text-2:#9A9384;--c-brand:#FFC72E;--c-brand-pressed:#E0A800;--c-on-brand:#1F1A05;--c-brand-sub:#3A2F0C;--c-success:#4ADE80;--c-error:#F87171;}
</style>
</helmet>
<div class="{{ themeClass }}" style="width:360px; height:780px; display:flex; flex-direction:column; background: var(--c-bg,#FFFFFF); color: var(--c-text,#1A1814); border-radius:30px; overflow:hidden; font-family:'Golos Text','Manrope',sans-serif; box-shadow: inset 0 0 0 1px var(--c-border,#E3DDD0);">

  <div style="height:36px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; font-weight:600; color: var(--c-text,#1A1814);">
    <span>9:41</span>
    <span style="display:inline-flex; align-items:center; gap:6px;">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 3.2C10.4 3.2 12.1 3.9 13.4 5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5.2 6.4C6.1 5.6 7.3 5.1 8.5 5.1C9.7 5.1 10.9 5.6 11.8 6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="8.6" r="1.2" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1.6" width="20" height="8.8" rx="2.4" stroke="currentColor" stroke-width="1.4"/><rect x="2.8" y="3.4" width="14" height="5.2" rx="1.2" fill="currentColor"/><rect x="22.4" y="4" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
    </span>
  </div>

  <div style="flex:0 0 auto; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:8px 20px 14px;">
    <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
      <div style="font-size:26px; font-weight:700; line-height:1.1; letter-spacing:-0.01em;">{{ month }}</div>
      <div style="font-size:14px; font-weight:400; color: var(--c-text-2,#6B665C);">{{ countText }}</div>
    </div>
    <button style="width:48px; height:48px; margin:-6px -12px 0 0; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:transparent; border:none; color: var(--c-text,#1A1814); cursor:pointer;" aria-label="Настройки">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>

  <sc-if value="{{ showHint }}" hint-placeholder-val="{{ false }}">
    <div style="flex:0 0 auto; margin:0 20px 14px; padding:14px 16px; border-radius:12px; background: var(--c-brand-sub,#FFF4D6); display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex:0 0 auto; margin-top:1px; color: var(--c-text,#1A1814);"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5M12 7.6h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div style="font-size:14px; font-weight:400; line-height:1.4; color: var(--c-text,#1A1814);">{{ hintText }}</div>
      </div>
      <button style="align-self:flex-start; min-height:40px; padding:0 16px; border-radius:10px; border:none; background: var(--c-brand,#FFC000); color: var(--c-on-brand,#1F1A05); font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;">Обновить категории</button>
    </div>
  </sc-if>

  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 32px; gap:12px;">
      <div style="width:64px; height:64px; border-radius:16px; background: var(--c-surface,#F7F5F0); display:flex; align-items:center; justify-content:center; margin-bottom:4px; color: var(--c-text-2,#6B665C);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5" width="19" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 9.5h19" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <div style="font-size:18px; font-weight:600; color: var(--c-text,#1A1814);">{{ emptyTitle }}</div>
      <div style="font-size:14px; font-weight:400; line-height:1.45; color: var(--c-text-2,#6B665C); max-width:250px; text-wrap:pretty;">{{ emptyText }}</div>
      <button style="margin-top:8px; min-height:48px; padding:0 22px; border-radius:10px; border:none; background: var(--c-brand,#FFC000); color: var(--c-on-brand,#1F1A05); font-family:inherit; font-size:16px; font-weight:600; cursor:pointer;">{{ emptyBtn }}</button>
    </div>
  </sc-if>

  <sc-if value="{{ hasGrid }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1 1 auto; overflow-y:auto; padding:0 20px 20px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="8">
          <dc-import name="CategoryTile" category="{{ t.category }}" percent="{{ t.percent }}" bank-name="{{ t.bankName }}" bank-color="{{ t.bankColor }}" hint-size="100%,120px"></dc-import>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ banner }}" hint-placeholder-val="{{ false }}">
    <div style="flex:0 0 auto; height:56px; display:flex; align-items:center; justify-content:center; padding:3px 20px;">
      <div style="width:100%; max-width:320px; height:50px; border-radius:8px; border:1px dashed var(--c-border,#E3DDD0); background: var(--c-surface-2,#EFEBE2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; color: var(--c-text-2,#6B665C);">место под рекламу · 320×50</div>
    </div>
  </sc-if>

  <div style="flex:0 0 auto; height:64px; border-top:1px solid var(--c-border,#E3DDD0); display:flex; align-items:stretch; padding:0 24px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color: var(--c-text,#1A1814);">
      <div style="position:relative; width:44px; height:26px; display:flex; align-items:center; justify-content:center;">
        <div style="position:absolute; inset:0; border-radius:999px; background: var(--c-brand-sub,#FFF4D6);"></div>
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" style="position:relative;"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <span style="font-size:11px; font-weight:600;">Кэшбэк</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color: var(--c-text-2,#6B665C);">
      <div style="width:44px; height:26px; display:flex; align-items:center; justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5" width="19" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 9.5h19" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <span style="font-size:11px; font-weight:500;">Карты</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 360, &quot;height&quot;: 780 },
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;state&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;normal&quot;, &quot;empty&quot;, &quot;nocats&quot;, &quot;newmonth&quot;, &quot;overflow&quot;], &quot;default&quot;: &quot;normal&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;banner&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  data() {
    const C = { sber:'#21A038', alfa:'#EF3124', tb:'#1C1C1E', vtb:'#009FDF', raif:'#FEE600' };
    const base = [
      { category:'Супермаркеты', percent:5, bankName:'Сбербанк', bankColor:C.sber },
      { category:'Кафе и рестораны', percent:7, bankName:'Альфа-Банк', bankColor:C.alfa },
      { category:'Такси', percent:10, bankName:'Т-Банк', bankColor:C.tb },
      { category:'Транспорт', percent:5, bankName:'ВТБ', bankColor:C.vtb },
      { category:'АЗС и заправки', percent:7, bankName:'Райффайзен', bankColor:C.raif },
      { category:'Аптеки', percent:5, bankName:'Сбербанк', bankColor:C.sber },
      { category:'Развлечения', percent:5, bankName:'Альфа-Банк', bankColor:C.alfa },
      { category:'Онлайн-подписки', percent:7, bankName:'Т-Банк', bankColor:C.tb },
      { category:'Красота', percent:5, bankName:'ВТБ', bankColor:C.vtb },
      { category:'Одежда и обувь', percent:5, bankName:'Райффайзен', bankColor:C.raif },
      { category:'Путешествия', percent:3, bankName:'Альфа-Банк', bankColor:C.alfa },
      { category:'Дом и ремонт', percent:5, bankName:'Сбербанк', bankColor:C.sber }
    ];
    const extra = [
      { category:'Ювелирные украшения и часы', percent:9, bankName:'Альфа-Банк', bankColor:C.alfa },
      { category:'Цветы', percent:5, bankName:'Сбербанк', bankColor:C.sber },
      { category:'Фастфуд', percent:7, bankName:'Т-Банк', bankColor:C.tb },
      { category:'Спорт и фитнес', percent:5, bankName:'ВТБ', bankColor:C.vtb },
      { category:'Дети и игрушки', percent:5, bankName:'Райффайзен', bankColor:C.raif },
      { category:'Электроника', percent:3, bankName:'Альфа-Банк', bankColor:C.alfa },
      { category:'Книги', percent:5, bankName:'Сбербанк', bankColor:C.sber },
      { category:'Кино и театр', percent:7, bankName:'Т-Банк', bankColor:C.tb }
    ];
    return { base, all: base.concat(extra) };
  }
  renderVals() {
    const state = this.props.state || 'normal';
    const banner = this.props.banner !== false;
    const d = this.data();
    let tiles = d.base;
    if (state === 'overflow') tiles = d.all;
    const n = tiles.length;
    const plural = n => n % 10 === 1 && n % 100 !== 11 ? 'активная категория' : ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) ? 'активные категории' : 'активных категорий';
    const isEmpty = state === 'empty' || state === 'nocats';
    return {
      themeClass: this.props.theme === 'dark' ? 'mc-dark' : '',
      month: 'Февраль',
      banner,
      isEmpty,
      hasGrid: !isEmpty,
      showHint: state === 'newmonth',
      hintText: 'Наступил февраль. Категории кэшбэка за прошлый месяц больше не действуют — выберите новые.',
      countText: isEmpty ? (state === 'empty' ? 'Нет карт' : 'Категории не выбраны') : (n + ' ' + plural(n)),
      tiles: isEmpty ? [] : tiles,
      emptyTitle: state === 'empty' ? 'Добавьте первую карту' : 'Категории на февраль не выбраны',
      emptyText: state === 'empty'
        ? 'Чтобы у кассы видеть, какой картой платить, добавьте свои банковские карты.'
        : 'Карты добавлены. Загрузите скриншоты из банковских приложений — МегаКэш подскажет, что выбрать.',
      emptyBtn: state === 'empty' ? 'Добавить карту' : 'Настроить кэшбэк'
    };
  }
}
</script>
</body>
</html>
