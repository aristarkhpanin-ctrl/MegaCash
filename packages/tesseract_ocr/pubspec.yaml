name: tesseract_ocr
description: Tesseract 4 adds a new neural net (LSTM) based OCR engine which is
  focused on line recognition. It has unicode (UTF-8) support, and can recognize
  more than 100 languages.

version: 0.5.0
homepage: https://github.com/arrrrny/tesseract_ocr

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.10.0" # Require Flutter SDK 1.10.0 or higher for platforms key

dependencies:
  flutter:
    sdk: flutter
  path: ^1.8.0
  path_provider: ^2.0.2
  plugin_platform_interface: ^2.0.2 # Added for federated plugins

dev_dependencies:
  flutter_test:
    sdk: flutter



flutter:




  plugin:
    platforms:
      android:
        package: io.paratoner.tesseract_ocr
        pluginClass: TesseractOcrPlugin
      ios:
        pluginClass: TesseractOcrPlugin





























