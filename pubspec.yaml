name: megacash
description: "МегаКэш — подсказывает, какой картой платить, чтобы получить больший кэшбэк."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Состояние
  flutter_riverpod: ^3.0.0
  # Навигация
  go_router: ^16.0.0

  # Локальная база.
  #
  # Официальный `isar` заброшен с апреля 2023 и объявляет `sdk: <3.0.0` —
  # с Dart 3.12 он не собирается вовсе. `isar_community` — поддерживаемый
  # форк с тем же API; импорты остаются вида `package:isar_community/isar.dart`.
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.5

  # Распознавание текста.
  #
  # ML Kit от Google распознаёт латиницу, китайский, деванагари, японский
  # и корейский — кириллицы среди них нет, для русского приложения он
  # не годится вовсе. Tesseract с русской моделью работает офлайн
  # и кириллицу читает.
  # Взят в репозиторий и починен: опубликованный пакет объявлял свой
  # buildscript с AGP 8.2.1 и мёртвым jcenter, из-за чего проект
  # не конфигурировался под AGP 9. Подробности в packages/tesseract_ocr.
  tesseract_ocr:
    path: packages/tesseract_ocr
  image_picker: ^1.1.2
  # Версия 12, а не 13: тринадцатая тянет win32 несовместимой версии
  # и не уживается с file_picker. Нам нужен только Android, но pub
  # разрешает зависимости сразу под все платформы.
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/categories.json
    - assets/tessdata_config.json
    # Модели Tesseract. Быстрый набор: русская 3,7 МБ, английская 1,9 МБ —
    # английская нужна для названий магазинов вроде Lamoda и zolla.
    - assets/tessdata/

  fonts:
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GolosText-Bold.ttf
          weight: 700
        - asset: assets/fonts/GolosText-ExtraBold.ttf
          weight: 800
